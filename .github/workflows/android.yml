name: Android

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_CONTENT != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: zao/ooz
          path: ooz-src
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: CLI (bionic runtime)
        run: bash android/make-bionic.sh . out net9.0

      - name: Texture decoder
        run: bash android/build-t2d.sh . out

      - name: Oodle
        run: bash android/build-ooz.sh ooz-src out

      - name: Bundle CLI into the app
        run: |
          A=android-app/app/src/main/assets
          mkdir -p $A
          (cd out && zip -qr ../$A/cli.zip .)
          echo "tag=android.${{ github.run_number }}" > $A/cli.info
          cp $A/cli.zip AssetStudioModCLI-android-arm64.zip

      - name: Release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_CONTENT: ${{ secrets.KEYSTORE_CONTENT }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_CONTENT" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEYSTORE_ALIAS" "$KEYSTORE_PASSWORD" \
            > android-app/keystore.properties

      - name: Build APK
        working-directory: android-app
        run: gradle assembleRelease --no-daemon -PbuildNumber=${{ github.run_number }}

      - name: Collect
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk "AssetStudioMod-Android-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: AssetStudioMod-Android
          path: |
            AssetStudioMod-Android-*.apk
            AssetStudioModCLI-android-arm64.zip

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          printf '%s\n' \
            "- Export assets, dumps and Live2D from Unity files and bundles" \
            "- Textures, sprites, audio, text, fonts, shaders, meshes, video" \
            "- Image format, grouping, name filter, overwrite options" \
            "- Runs in the background with a live log" > notes.md
          gh release create "android-$N" "AssetStudioMod-Android-$N.apk" AssetStudioModCLI-android-arm64.zip \
            --target "$GITHUB_SHA" --title "Android $N" --notes-file notes.md
